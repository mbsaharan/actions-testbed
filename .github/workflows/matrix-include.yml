name: CI Matrix Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Base matrix variables
        version: [10, 12, 14]
        os: [ubuntu-latest, windows-latest]

        include:
          # Step 1: Add macOS to the matrix
          - os: macos-latest
            version: 14

          # Step 2: Add version 20 to the matrix
          - os: ubuntu-latest
            version: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Print current matrix configuration
        run: |
          echo "Running on OS: ${{ matrix.os }}"
          echo "Using Node Version: ${{ matrix.version }}"
