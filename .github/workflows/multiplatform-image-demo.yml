name: Multiplatform Image Demo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required for GITHUB_TOKEN to push to GHCR

    steps:
      # Step 1: Checkout repository to access the physical Dockerfile
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up QEMU for multi-architecture emulation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 3: Set up Docker Buildx engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Log in to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Build and Push using the repository Dockerfile
      - name: Build and Push Multi-Architecture Image
        uses: docker/build-push-action@v6
        with:
          context: .                # Build context (root of repo)
          file: ./Dockerfile.dev        # Path to physical Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/multiplatform-image:latest
          platforms: linux/amd64,linux/arm64
