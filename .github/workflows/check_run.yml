name: Handle Check Run Events

on:
  check_run:
    types: [completed, rerequested]

jobs:
  process_check_run:
    runs-on: ubuntu-latest
    steps:
      - name: Log Check Run Details
        run: |
          echo "Check Run Name: ${{ github.event.check_run.name }}"
          echo "Status: ${{ github.event.check_run.status }}"
          echo "Conclusion: ${{ github.event.check_run.conclusion }}"
          echo "Action Taken: ${{ github.event.action }}"

      - name: Perform Action on Failure
        if: github.event.check_run.conclusion == 'failure'
        run: |
          echo "The check run '${{ github.event.check_run.name }}' failed. Sending notification..."
          # Insert custom logic here (e.g., send a Slack message, open a ticket, etc.)
