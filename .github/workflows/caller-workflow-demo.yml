name: Main CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. Call the reusable linting workflow
  call-lint-job:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      node-version: '20'

  # 2. Run another job that depends on the called workflow finishing
  build:
    needs: call-lint-job
    runs-on: ubuntu-latest
    steps:
      - name: Build Application
        run: echo "Building app after linting succeeds..."

# This workflow is part of reusable-lint.yml demonstration
