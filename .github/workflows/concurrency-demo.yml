name: Concurrency Test Workflow

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulated-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Start Info
        run: |
          echo "Starting long task on branch: ${{ github.ref }}"
          echo "Run ID: ${{ github.run_id }}"

      - name: Simulate Work
        run: sleep 30

      - name: Print Completion
        run: echo "Task finished successfully!"
