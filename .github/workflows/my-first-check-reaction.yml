name: My first check reaction
on:
  workflow_run:
    workflows: ["CodeQL Setup"] # <-- the name you saw in your screenshot
    types:
      - completed
  # keep check_run too so you know both for GH-200
  check_run:
    types: [completed]

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "CodeQL conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Check name: ${{ github.event.check_run.name }}"
