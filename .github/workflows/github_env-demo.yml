name: GITHUB_ENV Demo

on: [push]

env: # workflow level
  MY_VAR: original_value

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set API_VERSION dynamically
        run: |
          echo "API_VERSION=2.1" >> "$GITHUB_ENV"
          echo "Set API_VERSION to 2.1"

      - name: Use API_VERSION in next step
        run: |
          echo "Version from shell: $API_VERSION"
          echo "Version from context: ${{ env.API_VERSION }}"

# Variables declared inside a step's env block are only available to that specific step. They will not persist to 
# subsequent steps.
# echo "API_VERSION=2.1" >> "$GITHUB_ENV" sets the environment variable dynamically during step execution so that 
# subsequent steps in the same job can access it.

  my_var-job-1:
    runs-on: ubuntu-latest
    steps:
      - run: echo "MY_VAR is $MY_VAR" # -> original_value
      - run: echo "MY_VAR=new_value" >> $GITHUB_ENV
      - run: echo "MY_VAR is $MY_VAR" # -> new_value
      - run: echo "${{ env.MY_VAR }}" # -> new_value - env context also sees it
  
# Once you write to $GITHUB_ENV, that variable is injected into the runner's environment for every subsequent step in 
# that same job. It effectively overrides the workflow-level value for that job only.

  my_var-job-2:
    runs-on: ubuntu-latest
    needs: my_var-job-1
    steps:
      - run: echo "MY_VAR is $MY_VAR" # -> original_value, NOT new_value
