name: Cache From URL List

on:
  push:
  workflow_dispatch:

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Image Folder
        id: image-cache
        uses: actions/cache@v4
        with:
          path: my-downloads
          key: images-v1-${{ hashFiles('config/image-urls.txt') }}
          restore-keys: |
            images-v1-

      - name: Download Images from List
        if: steps.image-cache.outputs.cache-hit!= 'true'
        shell: python
        run: |
          import urllib.request
          from pathlib import Path

          download_dir = Path("my-downloads")
          download_dir.mkdir(exist_ok=True) # same as mkdir -p

          print("Cache miss for this URL list. Downloading...")

          with open("config/image-urls.txt") as f:
              for line in f:
                  url = line.strip()
                  if not url: # same as [ -z "$url" ] && continue
                      continue

                  # same as basename "${url%%\?*}"
                  filename = url.split("?")[0].split("/")[-1]
                  dest = download_dir / filename

                  print(f" -> {url} -> {filename}")
                  urllib.request.urlretrieve(url, dest) # same as curl -o

      - name: Verify
        run: |
          echo "Hash of url list: ${{ hashFiles('config/image-urls.txt') }}"
          ls -lh my-downloads/
